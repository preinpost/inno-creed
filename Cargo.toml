[package]
name = "inno-creed"
version = "1.0.0"
edition = "2024"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
base64 = "0.23.0"
cbc = "0.2.1"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "gzip", "http2"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
