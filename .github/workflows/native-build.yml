name: native-embed

# 내장 Glimpse 네이티브 바이너리 빌드 & 커밋
#
# 작업 대상            파일                                   빌드 방식
# linux x86_64   →  native/linux/glimpse-x86_64   Docker (linux/amd64)
# linux aarch64  →  native/linux/glimpse-aarch64  Docker (linux/arm64, QEMU)
# windows x86_64 →  native/windows/glimpse.exe    dotnet publish (Windows 전용 TFM)
# macOS arm64    →  native/macos/glimpse          swiftc -target arm64 (macOS 러너에서 크로스)
#
# 실행 조건:
#   - workflow_dispatch (수동) — 바이너리가 이미 커밋돼 있으면 force 없이는 스킵
#   - native/src 등 소스 변경 push
# 결과: native/ 아래에 바이너리 커밋 (GITHUB_TOKEN, contents: write)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "기존 바이너리가 있어도 강제 재빌드"
        type: boolean
        default: false
  push:
    paths:
      - "native/src/**"
      - "native/windows/**"
      - "native/docker/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - id: skip
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "force — 빌드 진행"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f native/macos/glimpse ]; then
            echo "이미 존재: native/macos/glimpse — 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "바이너리 없음 — 빌드 진행"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.skip.outputs.skip != 'true'
        run: swiftc -target arm64-apple-macos12 -O native/src/glimpse.swift -o native/macos/glimpse

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-macos
          path: native/macos/glimpse
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            target_file: native/linux/glimpse-x86_64
          - platform: linux/arm64
            arch: aarch64
            target_file: native/linux/glimpse-aarch64
    steps:
      - uses: actions/checkout@v4

      # 이미 바이너리가 커밋돼 있고 강제가 아니면 스킵 ("있으면 안 돌게")
      - id: skip
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "force — 빌드 진행"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f "${{ matrix.target_file }}" ]; then
            echo "이미 존재: ${{ matrix.target_file }} — 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "바이너리 없음 — 빌드 진행"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - if: steps.skip.outputs.skip != 'true'
        run: docker build --platform ${{ matrix.platform }} -f native/docker/linux-build.Dockerfile -t glimpse-linux-build .

      - if: steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p native/linux
          docker run --rm -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -v "$PWD/native/src/linux:/build" -v "$PWD/native/linux:/out" glimpse-linux-build
          mv native/linux/glimpse "${{ matrix.target_file }}"
          chmod +x "${{ matrix.target_file }}"
          echo "빌드 완료: ${{ matrix.target_file }}"

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-linux-${{ matrix.arch }}
          path: ${{ matrix.target_file }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - id: skip
        shell: bash
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "force — 빌드 진행"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f native/windows/glimpse.exe ]; then
            echo "이미 존재: native/windows/glimpse.exe — 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "바이너리 없음 — 빌드 진행"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - if: steps.skip.outputs.skip != 'true'
        run: dotnet publish native/windows/Glimpse.Windows.csproj -c Release -r win-x64 --self-contained -o bin

      - if: steps.skip.outputs.skip != 'true'
        run: copy bin\glimpse.exe native\windows\glimpse.exe

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-windows-x86_64
          path: native/windows/glimpse.exe
          if-no-files-found: error

  commit:
    needs: [macos, linux, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          if-no-files-found: ignore

      - name: 배치 및 커밋
        run: |
          mkdir -p native/linux native/windows native/macos
          cp artifacts/glimpse-x86_64 native/linux/ || true
          cp artifacts/glimpse-aarch64 native/linux/ || true
          cp artifacts/glimpse.exe native/windows/ || true
          cp artifacts/glimpse native/macos/ || true
          chmod +x native/linux/* native/macos/glimpse 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "build(native): Glimpse 네이티브 바이너리 재빌드"
            git push origin HEAD:${{ github.ref_name }}
          fi